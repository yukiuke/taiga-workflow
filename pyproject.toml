[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taiga-ingest"
version = "0.1.0"
description = "Validate and dry-run Taiga ingest payloads for the agentic workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.22.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
taiga-ingest = "tools.taiga_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]

[tool.setuptools.package-data]
"tools.taiga_ingest" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
